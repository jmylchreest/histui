# https://taskfile.dev
version: '3'

vars:
  # Use gitversion for semver if available, otherwise fallback
  VERSION:
    sh: |
      if command -v gitversion >/dev/null 2>&1; then
        gitversion -showvariable SemVer 2>/dev/null || echo "0.0.0-dev"
      elif git describe --tags --exact-match 2>/dev/null; then
        git describe --tags --exact-match | sed 's/^v//'
      else
        SHA=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
        echo "0.0.0-dev+${SHA}"
      fi
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo "unknown"
  BUILD_TIME:
    sh: date -u +"%Y-%m-%dT%H:%M:%SZ"
  LDFLAGS: '-s -w -X main.version={{.VERSION}} -X main.commit={{.COMMIT}} -X main.buildTime={{.BUILD_TIME}}'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # Build tasks - all output to dist/
  dist:
    desc: Build everything to dist/ (binaries + docs)
    cmds:
      - task: dist:clean
      - task: dist:histui
      - task: dist:histuid
      - task: dist:docs
      - echo "Build complete. Check dist/ folder."

  dist:clean:
    desc: Clean dist folder
    cmds:
      - rm -rf dist/
      - mkdir -p dist/

  dist:histui:
    desc: Build histui CLI to dist/
    env:
      CGO_ENABLED: '0'
    cmds:
      - mkdir -p dist/
      - go build -ldflags "{{.LDFLAGS}}" -o dist/histui ./cmd/histui

  dist:histuid:
    desc: Build histuid daemon to dist/ (requires GTK4)
    env:
      CGO_ENABLED: '1'
    cmds:
      - mkdir -p dist/
      - go build -ldflags "{{.LDFLAGS}}" -o dist/histuid ./cmd/histuid

  dist:docs:
    desc: Build docs to dist/docs/
    dir: docs
    cmds:
      - npm run build
      - rm -rf ../dist/docs
      - mv build ../dist/docs

  install:
    desc: Install histui to GOPATH/bin
    cmds:
      - go install -ldflags "{{.LDFLAGS}}" ./cmd/histui

  # Code quality
  test:
    desc: Run all tests
    cmds:
      - go test -v ./...

  test-coverage:
    desc: Run tests with coverage
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html
      - echo "Coverage report generated at coverage.html"

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run

  lint-fix:
    desc: Run golangci-lint with auto-fix
    cmds:
      - golangci-lint run --fix

  fmt:
    desc: Format code
    cmds:
      - go fmt ./...

  tidy:
    desc: Tidy go.mod
    cmds:
      - go mod tidy

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf dist/
      - rm -f coverage.out coverage.html

  all:
    desc: Format, lint, test, and build
    cmds:
      - task: fmt
      - task: lint
      - task: test
      - task: dist:histui
      - task: dist:histuid

  # Documentation tasks
  docs:dev:
    desc: Start documentation development server
    dir: docs
    cmds:
      - npm start

  docs:build:
    desc: Build documentation for production
    dir: docs
    cmds:
      - npm run build

  docs:serve:
    desc: Serve built documentation locally
    dir: docs
    cmds:
      - npm run serve

  docs:install:
    desc: Install documentation dependencies
    dir: docs
    cmds:
      - npm install
