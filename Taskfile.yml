# https://taskfile.dev
version: '3'

vars:
  # Use gitversion for semver if available, otherwise fallback to git describe
  VERSION:
    sh: |
      if command -v gitversion >/dev/null 2>&1; then
        gitversion -showvariable SemVer 2>/dev/null || echo "0.0.0-dev"
      elif git describe --tags --exact-match >/dev/null 2>&1; then
        # Exact tag match - use the tag directly
        git describe --tags --exact-match | sed 's/^v//'
      elif git describe --tags >/dev/null 2>&1; then
        # Ahead of a tag - extract version and build metadata
        DESC=$(git describe --tags 2>/dev/null)
        # Extract semver base (e.g., 0.0.1 from v0.0.1-dev.0-abc123-57-g51d534c)
        BASE=$(echo "$DESC" | sed -E 's/^v?([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
        # Extract commit count (second-to-last segment before -gSHA)
        COUNT=$(echo "$DESC" | sed -E 's/.*-([0-9]+)-g[a-f0-9]+$/\1/')
        # Extract current SHA
        SHA=$(git rev-parse --short HEAD 2>/dev/null)
        echo "v${BASE}-dev.${COUNT}-${SHA}"
      else
        SHA=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
        echo "v0.0.0-dev.0-${SHA}"
      fi
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo "unknown"
  BUILD_TIME:
    sh: date -u +"%Y-%m-%dT%H:%M:%SZ"
  LDFLAGS: '-s -w -X main.version={{.VERSION}} -X main.commit={{.COMMIT}} -X main.buildTime={{.BUILD_TIME}}'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # Build tasks - all output to dist/
  dist:
    desc: Build everything to dist/ (binaries + docs)
    cmds:
      - task: dist:clean
      - task: dist:histui
      - task: dist:histuid
      - task: dist:docs
      - echo "Build complete. Check dist/ folder."

  dist:clean:
    desc: Clean dist folder
    cmds:
      - rm -rf dist/
      - mkdir -p dist/

  dist:histui:
    desc: Build histui CLI to dist/
    env:
      CGO_ENABLED: '0'
    cmds:
      - mkdir -p dist/
      - go build -ldflags "{{.LDFLAGS}}" -o dist/histui ./cmd/histui

  dist:histuid:
    desc: Build histuid daemon to dist/ (requires GTK4)
    env:
      CGO_ENABLED: '1'
      CC: 'ccache gcc'
      CGO_CFLAGS: '-O2'
    cmds:
      - mkdir -p dist/
      - go build -ldflags "{{.LDFLAGS}}" -o dist/histuid ./cmd/histuid

  dist:histuid:fast:
    desc: Build histuid daemon with fast compilation (no optimization)
    env:
      CGO_ENABLED: '1'
      CC: 'ccache gcc'
      CGO_CFLAGS: '-O0'
    cmds:
      - mkdir -p dist/
      - go build -ldflags "{{.LDFLAGS}}" -o dist/histuid ./cmd/histuid

  dist:docs:
    desc: Build docs to dist/docs/
    dir: docs
    cmds:
      - npm run build
      - rm -rf ../dist/docs
      - mv build ../dist/docs

  install:
    desc: Install histui and histuid to GOPATH/bin
    cmds:
      - CGO_ENABLED=0 go install -ldflags "{{.LDFLAGS}}" ./cmd/histui
      - CGO_ENABLED=1 go install -ldflags "{{.LDFLAGS}}" ./cmd/histuid

  install:histui:
    desc: Install histui CLI only to GOPATH/bin
    cmds:
      - CGO_ENABLED=0 go install -ldflags "{{.LDFLAGS}}" ./cmd/histui

  install:histuid:
    desc: Install histuid daemon only to GOPATH/bin (requires GTK4)
    env:
      CGO_ENABLED: '1'
      CC: 'ccache gcc'
      CGO_CFLAGS: '-O2'
    cmds:
      - go install -ldflags "{{.LDFLAGS}}" ./cmd/histuid

  # Development
  run:
    desc: Run histuid with live reload (requires air)
    deps:
      - run:check-air
    cmds:
      - air

  run:once:
    desc: Build and run histuid once (no live reload)
    deps:
      - dist:histuid:fast
    cmds:
      - ./dist/histuid

  run:check-air:
    desc: Check if air is installed
    silent: true
    cmds:
      - |
        if ! command -v air >/dev/null 2>&1; then
          echo "air is not installed. Install with: go install github.com/air-verse/air@latest"
          exit 1
        fi

  # Code quality
  test:
    desc: Run all tests
    env:
      CC: 'ccache gcc'
      CGO_CFLAGS: '-O0'
    cmds:
      - go test -v -timeout 60s ./...

  test:race:
    desc: Run all tests with race detector (uses ccache for faster CGO builds)
    env:
      CC: 'ccache gcc'
      CGO_CFLAGS: '-O0'
    cmds:
      - go test -race -v -timeout 60s ./...

  test:race:pure:
    desc: Run tests with race detector (pure Go packages only, no CGO)
    cmds:
      - go test -race -v -timeout 60s ./internal/model/... ./internal/core/... ./internal/config/... ./internal/dbus/... ./internal/icon/... ./internal/tui/... ./internal/db/... ./internal/adapter/...

  test-coverage:
    desc: Run tests with coverage
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html
      - echo "Coverage report generated at coverage.html"

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run

  lint-fix:
    desc: Run golangci-lint with auto-fix
    cmds:
      - golangci-lint run --fix

  fmt:
    desc: Format code
    cmds:
      - go fmt ./...

  tidy:
    desc: Tidy go.mod
    cmds:
      - go mod tidy

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf dist/
      - rm -f coverage.out coverage.html

  all:
    desc: Format, lint, test, and build
    cmds:
      - task: fmt
      - task: lint
      - task: test
      - task: dist:histui
      - task: dist:histuid

  # Documentation tasks
  docs:dev:
    desc: Start documentation development server
    dir: docs
    cmds:
      - npm start

  docs:build:
    desc: Build documentation for production
    dir: docs
    cmds:
      - npm run build

  docs:serve:
    desc: Serve built documentation locally
    dir: docs
    cmds:
      - npm run serve

  docs:install:
    desc: Install documentation dependencies
    dir: docs
    cmds:
      - npm install

  # Package testing
  test:pkgbuild:
    desc: Test PKGBUILD by building actual package from current source
    vars:
      # Convert VERSION to valid pkgver (remove 'v' prefix, replace - with .)
      PKGVER:
        sh: echo "{{.VERSION}}" | sed 's/^v//' | sed 's/-/./g'
    cmds:
      - |
        set -e
        TMPDIR=$(mktemp -d)
        SRCDIR="${TMPDIR}/histui-{{.PKGVER}}"
        echo "Testing PKGBUILD with version {{.PKGVER}}"
        echo "Working directory: ${TMPDIR}"

        # Create source tarball from current repo
        mkdir -p "${SRCDIR}"
        git archive --format=tar HEAD | tar -x -C "${SRCDIR}"

        # Create tarball for PKGBUILD source
        cd "${TMPDIR}"
        tar czf "histui-{{.PKGVER}}.tar.gz" "histui-{{.PKGVER}}"

        # Copy and modify PKGBUILD from template
        cp "{{.ROOT_DIR}}/contrib/arch/histui/PKGBUILD" "${TMPDIR}/PKGBUILD"

        # Update pkgver
        sed -i "s/^pkgver=.*/pkgver={{.PKGVER}}/" "${TMPDIR}/PKGBUILD"

        # Update source to use local tarball
        sed -i 's|source=.*|source=("histui-{{.PKGVER}}.tar.gz")|' "${TMPDIR}/PKGBUILD"

        # Skip checksum validation for local testing
        sed -i "s/^sha256sums=.*/sha256sums=('SKIP')/" "${TMPDIR}/PKGBUILD"

        echo ""
        echo "=== Generated PKGBUILD ==="
        cat "${TMPDIR}/PKGBUILD"
        echo ""
        echo "=== Building package ==="
        cd "${TMPDIR}"
        makepkg -f

        echo ""
        echo "=== Success! Built package: ==="
        PKG=$(ls "${TMPDIR}"/*.pkg.tar.* 2>/dev/null | head -1)
        if [ -n "$PKG" ]; then
          ls -lh "$PKG"
          echo ""
          echo "=== Package contents: ==="
          bsdtar -tf "$PKG"
        else
          echo "No package found"
        fi

        # Cleanup
        rm -rf "${TMPDIR}"
        echo ""
        echo "Cleaned up ${TMPDIR}"

  # =============================================================================
  # Icon Alias Generation
  # =============================================================================
  # Generates icon-aliases.toml for histui by:
  # 1. Fetching upstream metadata (Font Awesome, MDI, Devicons)
  # 2. Generating kb-patterns.toml from upstream
  # 3. Merging with kb-patterns-manual.toml (manual overrides)
  # 4. Using AI to generate app lists (requires OPENROUTER_API_KEY)
  # 5. Outputting icon-aliases.toml
  #
  # See contrib/generate-icon-aliases/README.md for details.

  generate:icons:
    desc: Generate icon aliases (full workflow - fetch, AI, output)
    dir: contrib/generate-icon-aliases
    cmds:
      - task: generate:icons:build
      - task: generate:icons:fetch
      - task: generate:icons:ai
      - task: generate:icons:output
      - echo ""
      - echo "Done! Updated internal/icon/aliases_default.toml"

  generate:icons:build:
    desc: Build the icon alias generator
    dir: contrib/generate-icon-aliases
    cmds:
      - go build -o generate-icon-aliases .
    sources:
      - "*.go"
    generates:
      - generate-icon-aliases

  generate:icons:fetch:
    desc: Fetch upstream metadata and regenerate kb-patterns.toml
    dir: contrib/generate-icon-aliases
    deps: [generate:icons:build]
    cmds:
      - ./generate-icon-aliases --fetch --verbose
      - echo "Updated kb-patterns.toml from upstream sources"

  generate:icons:ai:
    desc: Generate AI app mappings (requires OPENROUTER_API_KEY)
    dir: contrib/generate-icon-aliases
    deps: [generate:icons:build]
    cmds:
      - |
        if [ -z "$OPENROUTER_API_KEY" ]; then
          echo "OPENROUTER_API_KEY not set - skipping AI generation"
          echo "Using existing kb-ai.json (if available)"
          exit 0
        fi
        echo "Generating AI app mappings..."
        ./generate-icon-aliases --generate-kb --verbose

  generate:icons:output:
    desc: Generate final icon-aliases.toml output
    dir: contrib/generate-icon-aliases
    deps: [generate:icons:build]
    cmds:
      - ./generate-icon-aliases --verbose --output ../../internal/icon/aliases_default.toml --font-output ../../internal/icon/fonts/SymbolsNerdFont-Regular.ttf
      - echo "Generated internal/icon/aliases_default.toml"
      - echo "Downloaded internal/icon/fonts/SymbolsNerdFont-Regular.ttf"

  generate:icons:clean:
    desc: Clean generated icon files and caches
    dir: contrib/generate-icon-aliases
    cmds:
      - rm -f generate-icon-aliases
      - rm -rf .cache
      - rm -f kb-patterns.toml kb-ai.json
      - echo "Cleaned generated files and cache"
