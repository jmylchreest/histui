# https://taskfile.dev
version: '3'

vars:
  # Use gitversion for semver if available, otherwise fallback
  VERSION:
    sh: |
      if command -v gitversion >/dev/null 2>&1; then
        gitversion -showvariable SemVer 2>/dev/null || echo "0.0.0-dev"
      elif git describe --tags --exact-match 2>/dev/null; then
        git describe --tags --exact-match | sed 's/^v//'
      else
        SHA=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
        echo "0.0.0-dev+${SHA}"
      fi
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo "unknown"
  BUILD_TIME:
    sh: date -u +"%Y-%m-%dT%H:%M:%SZ"
  LDFLAGS: '-s -w -X main.version={{.VERSION}} -X main.commit={{.COMMIT}} -X main.buildTime={{.BUILD_TIME}}'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  build:
    desc: Build both histui and histuid binaries
    cmds:
      - task: build-histui
      - task: build-histuid

  build-histui:
    desc: Build the histui CLI binary (CGO_ENABLED=0)
    env:
      CGO_ENABLED: '0'
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o histui ./cmd/histui
    sources:
      - 'cmd/histui/**/*.go'
      - 'internal/**/*.go'
    generates:
      - histui

  build-histuid:
    desc: Build the histuid daemon binary (CGO_ENABLED=1, requires GTK4)
    env:
      CGO_ENABLED: '1'
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o histuid ./cmd/histuid
    sources:
      - 'cmd/histuid/**/*.go'
      - 'internal/**/*.go'
    generates:
      - histuid

  install:
    desc: Install histui to GOPATH/bin
    cmds:
      - go install -ldflags "{{.LDFLAGS}}" ./cmd/histui

  test:
    desc: Run all tests
    cmds:
      - go test -v ./...

  test-coverage:
    desc: Run tests with coverage
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html
      - echo "Coverage report generated at coverage.html"

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run

  lint-fix:
    desc: Run golangci-lint with auto-fix
    cmds:
      - golangci-lint run --fix

  fmt:
    desc: Format code
    cmds:
      - go fmt ./...

  tidy:
    desc: Tidy go.mod
    cmds:
      - go mod tidy

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -f histui histuid coverage.out coverage.html
      - rm -rf dist/

  dist:
    desc: Build everything to dist/ folder for pre-commit verification
    cmds:
      - task: dist:clean
      - task: dist:binaries
      - task: dist:docs
      - echo "Build complete. Check dist/ folder."
      - echo "  - dist/histui"
      - echo "  - dist/histuid"
      - echo "  - dist/docs/ (run 'npx serve dist/docs' to preview)"

  dist:clean:
    desc: Clean dist folder
    cmds:
      - rm -rf dist/
      - mkdir -p dist/

  dist:binaries:
    desc: Build binaries to dist/
    cmds:
      - task: dist:histui
      - task: dist:histuid

  dist:histui:
    desc: Build histui to dist/
    env:
      CGO_ENABLED: '0'
    cmds:
      - mkdir -p dist/
      - go build -ldflags "{{.LDFLAGS}}" -o dist/histui ./cmd/histui

  dist:histuid:
    desc: Build histuid to dist/
    env:
      CGO_ENABLED: '1'
    cmds:
      - mkdir -p dist/
      - go build -ldflags "{{.LDFLAGS}}" -o dist/histuid ./cmd/histuid

  dist:docs:
    desc: Build docs to dist/docs/
    dir: docs
    cmds:
      - npm run build
      - rm -rf ../dist/docs
      - mv build ../dist/docs

  run:
    desc: Build and run histui
    deps: [build]
    cmds:
      - ./histui {{.CLI_ARGS}}

  all:
    desc: Format, lint, test, and build
    cmds:
      - task: fmt
      - task: lint
      - task: test
      - task: build

  # Documentation tasks
  docs:dev:
    desc: Start documentation development server
    dir: docs
    cmds:
      - npm start

  docs:build:
    desc: Build documentation for production
    dir: docs
    cmds:
      - npm run build

  docs:serve:
    desc: Serve built documentation locally
    dir: docs
    cmds:
      - npm run serve

  docs:install:
    desc: Install documentation dependencies
    dir: docs
    cmds:
      - npm install
