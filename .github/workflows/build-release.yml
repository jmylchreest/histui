# Build workflow for histui
# - On version tags (v*): Create a release with clean semver
# - On main branch: Create a pre-release snapshot with dev version
#
# Note: This workflow does NOT run on main branch pushes if the commit is also tagged.
# Tags take precedence - the tag-triggered run will create the release.

name: Build Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      snapshot_retention:
        description: "Number of snapshot releases to keep"
        required: false
        default: "5"
        type: string
      use_cache:
        description: "Use Go build cache (disable if you suspect cache issues)"
        required: false
        default: true
        type: boolean

# Cancel in-progress runs for the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: stable
  SNAPSHOT_RETENTION: ${{ inputs.snapshot_retention || '5' }}

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_tag: ${{ steps.version.outputs.version_tag }}
      is_release: ${{ steps.version.outputs.is_release }}
      is_tagged: ${{ steps.version.outputs.is_tagged }}
      should_skip: ${{ steps.skip.outputs.should_skip }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Extract version
        id: version
        uses: jmylchreest/gha-extract-git-version@v1

      - name: Check if build should be skipped
        id: skip
        run: |
          # Skip main branch builds when the commit already has a release tag
          # (the tag-triggered workflow will handle it)
          if [[ "${{ github.ref }}" == refs/heads/main && "${{ steps.version.outputs.is_tagged }}" == "true" ]]; then
            echo "should_skip=true" >> $GITHUB_OUTPUT
          else
            echo "should_skip=false" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.os }}
    needs: prepare
    if: needs.prepare.outputs.should_skip != 'true'
    container:
      image: fedora:rawhide
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            os: ubuntu-latest
          - goos: linux
            goarch: arm64
            os: ubuntu-24.04-arm
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y git git-lfs golang gtk4-devel gtk4-layer-shell-devel libadwaita-devel alsa-lib-devel gobject-introspection-devel gcc

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Configure Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache Go build
        if: inputs.use_cache != false
        uses: actions/cache@v6
        with:
          path: |
            /root/.cache/go-build
            /root/go/pkg/mod
          key: ${{ runner.os }}-${{ runner.arch }}-go-${{ hashFiles('go.sum') }}-${{ github.run_number }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-go-${{ hashFiles('go.sum') }}-
            ${{ runner.os }}-${{ runner.arch }}-go-

      - name: Run tests (pure Go packages with race detector)
        run: |
          go test -race -v -timeout 60s \
            ./internal/model/... \
            ./internal/core/... \
            ./internal/config/... \
            ./internal/dbus/... \
            ./internal/icon/... \
            ./internal/tui/... \
            ./internal/db/... \
            ./internal/adapter/...

      - name: Run tests (CGO packages with race detector)
        run: |
          go test -race -v -timeout 60s \
            ./internal/theme/... \
            ./internal/layout/...

      - name: Build histui (CLI - pure Go)
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -ldflags "-s -w -X main.version=${{ needs.prepare.outputs.version }} -X main.commit=${{ github.sha }} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o histui ./cmd/histui

      - name: Build histuid (daemon - requires CGO for GTK4)
        env:
          CGO_ENABLED: 1
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -ldflags "-s -w -X main.version=${{ needs.prepare.outputs.version }} -X main.commit=${{ github.sha }} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o histuid ./cmd/histuid

      - name: Generate shell completions
        run: |
          mkdir -p completions
          # Completion scripts are architecture-independent text; generate
          # them once per build so they can ride along in the tarball, and
          # the amd64 job additionally publishes them as standalone assets
          # (see below) for the -bin package to consume.
          ./histui completion bash > completions/histui.bash
          ./histui completion zsh  > completions/_histui
          ./histui completion fish > completions/histui.fish

      - name: Create distribution
        run: |
          mkdir -p dist

          # Standalone binaries (for -bin package)
          cp histui dist/histui-${{ matrix.goos }}-${{ matrix.goarch }}
          cp histuid dist/histuid-${{ matrix.goos }}-${{ matrix.goarch }}

          # Standalone completion files (only from the amd64 job — content is
          # identical across arches so we don't need duplicates in release/).
          if [[ "${{ matrix.goarch }}" == "amd64" ]]; then
            cp completions/histui.bash dist/histui.bash
            cp completions/_histui    dist/_histui
            cp completions/histui.fish dist/histui.fish
          fi

          # Archive with all files
          tar -czvf dist/histui_${{ needs.prepare.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz \
            histui \
            histuid \
            contrib/histuid.service \
            contrib/histuid-monitor.service \
            completions/histui.bash \
            completions/_histui \
            completions/histui.fish \
            LICENSE \
            README.md

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: histui_${{ needs.prepare.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*
          retention-days: 1

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: needs.prepare.outputs.should_skip != 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: false

      - name: Prepare release assets
        run: |
          mkdir -p release

          # Move all build artifacts to release folder
          find artifacts -type f \( \
              -name "*.tar.gz" \
              -o -name "histui-*" \
              -o -name "histuid-*" \
              -o -name "histui.bash" \
              -o -name "_histui" \
              -o -name "histui.fish" \
            \) -exec mv {} release/ \;

          # Copy systemd units to release folder
          cp contrib/histuid.service release/
          cp contrib/histuid-monitor.service release/

          echo "=== Release assets ==="
          ls -la release/

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > checksums.txt
          echo "=== Checksums ==="
          cat checksums.txt

      - name: Generate changelog
        run: |
          if [[ "${{ needs.prepare.outputs.is_release }}" == "true" ]]; then
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              echo "## Changelog" > changelog.txt
              echo "" >> changelog.txt
              git log --pretty=format:"* %h %s" $PREV_TAG..HEAD | \
                grep -v "^* [a-f0-9]* docs:" | \
                grep -v "^* [a-f0-9]* test:" | \
                grep -v "^* [a-f0-9]* ci:" | \
                grep -v "^* [a-f0-9]* Merge" >> changelog.txt || echo "* No notable changes" >> changelog.txt
            else
              echo "* Initial release" > changelog.txt
            fi
          else
            cat > changelog.txt << EOF
          **Automated snapshot build from main branch**

          Version: \`${{ needs.prepare.outputs.version }}\`
          Commit: \`${{ github.sha }}\`

          This is an unstable development build. Use at your own risk.
          EOF
          fi
          echo "=== Changelog ==="
          cat changelog.txt

      - name: Create release
        run: |
          if [[ "${{ needs.prepare.outputs.is_release }}" == "true" ]]; then
            gh release create "${{ needs.prepare.outputs.version_tag }}" \
              --title "${{ needs.prepare.outputs.version_tag }}" \
              --notes-file changelog.txt \
              release/*
          else
            gh release create "${{ needs.prepare.outputs.version_tag }}" \
              --title "Snapshot ${{ needs.prepare.outputs.version }}" \
              --prerelease \
              --notes-file changelog.txt \
              release/*
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save checksums for publishing jobs
        uses: actions/upload-artifact@v7
        with:
          name: histui_${{ needs.prepare.outputs.version }}_checksums
          path: release/checksums.txt
          retention-days: 1

      - name: Cleanup old snapshot releases
        if: needs.prepare.outputs.is_release != 'true'
        run: |
          RETENTION=${{ env.SNAPSHOT_RETENTION }}
          echo "Keeping ${RETENTION} most recent snapshot releases"

          # List snapshot prereleases, newest first
          SNAPSHOTS=$(gh release list --limit 50 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease) | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-dev\\.")) | .tagName')

          COUNT=0
          for TAG in $SNAPSHOTS; do
            COUNT=$((COUNT + 1))
            if [ $COUNT -gt $RETENTION ]; then
              echo "Deleting old snapshot release: ${TAG}"
              gh release delete "${TAG}" --yes --cleanup-tag || true
            fi
          done

          echo "Cleanup complete. Kept ${RETENTION} most recent snapshots."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-aur:
    name: Publish to AUR
    runs-on: ubuntu-latest
    needs: [prepare, release]
    if: needs.prepare.outputs.is_release == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Download checksums
        uses: actions/download-artifact@v8
        with:
          name: histui_${{ needs.prepare.outputs.version }}_checksums
          path: checksums

      - name: Extract checksums
        id: checksums
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          CHECKSUM_FILE="checksums/checksums.txt"

          # Extract checksums for binaries
          SHA256_HISTUI_AMD64=$(grep "histui-linux-amd64$" "$CHECKSUM_FILE" | awk '{print $1}')
          SHA256_HISTUID_AMD64=$(grep "histuid-linux-amd64$" "$CHECKSUM_FILE" | awk '{print $1}')
          SHA256_HISTUI_ARM64=$(grep "histui-linux-arm64$" "$CHECKSUM_FILE" | awk '{print $1}')
          SHA256_HISTUID_ARM64=$(grep "histuid-linux-arm64$" "$CHECKSUM_FILE" | awk '{print $1}')

          # Extract checksums for common files
          SHA256_SERVICE=$(grep "histuid.service$" "$CHECKSUM_FILE" | awk '{print $1}')
          SHA256_MONITOR_SERVICE=$(grep "histuid-monitor.service$" "$CHECKSUM_FILE" | awk '{print $1}')

          # Shell completion scripts (arch-independent)
          SHA256_COMPLETION_BASH=$(grep " histui.bash$" "$CHECKSUM_FILE" | awk '{print $1}')
          SHA256_COMPLETION_ZSH=$(grep " _histui$"     "$CHECKSUM_FILE" | awk '{print $1}')
          SHA256_COMPLETION_FISH=$(grep " histui.fish$" "$CHECKSUM_FILE" | awk '{print $1}')

          # Get LICENSE checksum from GitHub raw
          SHA256_LICENSE=$(curl -sL "https://raw.githubusercontent.com/jmylchreest/histui/v${VERSION}/LICENSE" | sha256sum | awk '{print $1}')

          # Get source tarball checksum
          SHA256_SOURCE=$(curl -sL "https://github.com/jmylchreest/histui/archive/refs/tags/v${VERSION}.tar.gz" | sha256sum | awk '{print $1}')

          # Get example config checksum
          SHA256_EXAMPLE_CONFIG=$(curl -sL "https://raw.githubusercontent.com/jmylchreest/histui/v${VERSION}/docs/static/examples/histuid.toml" | sha256sum | awk '{print $1}')

          echo "SHA256_HISTUI_AMD64=${SHA256_HISTUI_AMD64}" >> $GITHUB_OUTPUT
          echo "SHA256_HISTUID_AMD64=${SHA256_HISTUID_AMD64}" >> $GITHUB_OUTPUT
          echo "SHA256_HISTUI_ARM64=${SHA256_HISTUI_ARM64}" >> $GITHUB_OUTPUT
          echo "SHA256_HISTUID_ARM64=${SHA256_HISTUID_ARM64}" >> $GITHUB_OUTPUT
          echo "SHA256_SERVICE=${SHA256_SERVICE}" >> $GITHUB_OUTPUT
          echo "SHA256_MONITOR_SERVICE=${SHA256_MONITOR_SERVICE}" >> $GITHUB_OUTPUT
          echo "SHA256_LICENSE=${SHA256_LICENSE}" >> $GITHUB_OUTPUT
          echo "SHA256_SOURCE=${SHA256_SOURCE}" >> $GITHUB_OUTPUT
          echo "SHA256_EXAMPLE_CONFIG=${SHA256_EXAMPLE_CONFIG}" >> $GITHUB_OUTPUT
          echo "SHA256_COMPLETION_BASH=${SHA256_COMPLETION_BASH}" >> $GITHUB_OUTPUT
          echo "SHA256_COMPLETION_ZSH=${SHA256_COMPLETION_ZSH}" >> $GITHUB_OUTPUT
          echo "SHA256_COMPLETION_FISH=${SHA256_COMPLETION_FISH}" >> $GITHUB_OUTPUT

          echo "=== Extracted checksums ==="
          cat "$CHECKSUM_FILE"
          echo "Source tarball: ${SHA256_SOURCE}"

      - name: Generate histui-bin PKGBUILD
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          mkdir -p aur/histui-bin

          sed -e "s/{{VERSION}}/${VERSION}/g" \
              -e "s/{{AUR_MAINTAINER}}/${{ secrets.AUR_MAINTAINER }}/g" \
              -e "s/{{SHA256_HISTUI_AMD64}}/${{ steps.checksums.outputs.SHA256_HISTUI_AMD64 }}/g" \
              -e "s/{{SHA256_HISTUID_AMD64}}/${{ steps.checksums.outputs.SHA256_HISTUID_AMD64 }}/g" \
              -e "s/{{SHA256_HISTUI_ARM64}}/${{ steps.checksums.outputs.SHA256_HISTUI_ARM64 }}/g" \
              -e "s/{{SHA256_HISTUID_ARM64}}/${{ steps.checksums.outputs.SHA256_HISTUID_ARM64 }}/g" \
              -e "s/{{SHA256_SERVICE}}/${{ steps.checksums.outputs.SHA256_SERVICE }}/g" \
              -e "s/{{SHA256_MONITOR_SERVICE}}/${{ steps.checksums.outputs.SHA256_MONITOR_SERVICE }}/g" \
              -e "s/{{SHA256_LICENSE}}/${{ steps.checksums.outputs.SHA256_LICENSE }}/g" \
              -e "s/{{SHA256_EXAMPLE_CONFIG}}/${{ steps.checksums.outputs.SHA256_EXAMPLE_CONFIG }}/g" \
              -e "s/{{SHA256_COMPLETION_BASH}}/${{ steps.checksums.outputs.SHA256_COMPLETION_BASH }}/g" \
              -e "s/{{SHA256_COMPLETION_ZSH}}/${{ steps.checksums.outputs.SHA256_COMPLETION_ZSH }}/g" \
              -e "s/{{SHA256_COMPLETION_FISH}}/${{ steps.checksums.outputs.SHA256_COMPLETION_FISH }}/g" \
              contrib/aur/histui-bin/PKGBUILD.template > aur/histui-bin/PKGBUILD

          echo "=== Generated histui-bin PKGBUILD ==="
          cat aur/histui-bin/PKGBUILD

      - name: Publish histui-bin to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.3
        with:
          pkgname: histui-bin
          pkgbuild: aur/histui-bin/PKGBUILD
          commit_username: github-actions[bot]
          commit_email: github-actions[bot]@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_KEY }}
          commit_message: "Update to ${{ needs.prepare.outputs.version }}"

      - name: Generate histui PKGBUILD
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          COMMIT="${{ github.sha }}"
          mkdir -p aur/histui

          sed -e "s/{{VERSION}}/${VERSION}/g" \
              -e "s/{{AUR_MAINTAINER}}/${{ secrets.AUR_MAINTAINER }}/g" \
              -e "s/{{SHA256_SOURCE}}/${{ steps.checksums.outputs.SHA256_SOURCE }}/g" \
              -e "s/{{COMMIT}}/${COMMIT}/g" \
              contrib/aur/histui/PKGBUILD.template > aur/histui/PKGBUILD

          echo "=== Generated histui PKGBUILD ==="
          cat aur/histui/PKGBUILD

      - name: Publish histui to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.3
        with:
          pkgname: histui
          pkgbuild: aur/histui/PKGBUILD
          commit_username: github-actions[bot]
          commit_email: github-actions[bot]@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_KEY }}
          commit_message: "Update to ${{ needs.prepare.outputs.version }}"

  version-docs:
    name: Version Documentation
    runs-on: ubuntu-latest
    needs: [prepare, release]
    if: needs.prepare.outputs.is_release == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
          ref: main  # Checkout main branch, not the tag (avoids detached HEAD)

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: docs

      - name: Create documentation version
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          if [ -f versions.json ] && grep -q "\"${VERSION}\"" versions.json; then
            echo "Version ${VERSION} already exists in documentation, skipping"
          else
            npm run docusaurus docs:version "${VERSION}"
          fi
        working-directory: docs

      - name: Commit version files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/versioned_docs docs/versioned_sidebars docs/versions.json
          git commit -m "docs: add version ${{ needs.prepare.outputs.version }}" || echo "No changes to commit"
          git push

  deploy-docs:
    name: Deploy Documentation
    needs: [prepare, version-docs]
    if: needs.prepare.outputs.is_release == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    secrets: inherit
