name: Test

on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "!*SNAPSHOT*"
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      use_cache:
        description: "Use Go build cache (disable if you suspect cache issues)"
        required: false
        default: true
        type: boolean

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    container:
      image: fedora:rawhide
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y git git-lfs golang gtk4 gtk4-layer-shell libadwaita alsa-lib gcc util-linux

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Configure Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache Go build
        if: inputs.use_cache != false
        uses: actions/cache@v6
        with:
          path: |
            /root/.cache/go-build
            /root/go/pkg/mod
          key: ${{ runner.os }}-${{ runner.arch }}-go-${{ hashFiles('go.sum') }}-${{ github.run_number }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-go-${{ hashFiles('go.sum') }}-
            ${{ runner.os }}-${{ runner.arch }}-go-

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests (pure Go packages with race detector)
        run: |
          go test -tags headless -race -v -timeout 60s \
            ./internal/model/... \
            ./internal/core/... \
            ./internal/config/... \
            ./internal/dbus/... \
            ./internal/icon/... \
            ./internal/tui/... \
            ./internal/db/... \
            ./internal/imagecapture/... \
            ./internal/adapter/...

      - name: Run GTK-independent theme/layout tests with race detector
        run: |
          CGO_ENABLED=1 sh scripts/puregotk/go.sh test -race -v -timeout 60s \
            ./internal/theme/... \
            ./internal/layout/...

      - name: Test audio without CGO
        run: CGO_ENABLED=0 go test -v -timeout 60s ./internal/audio

      - name: Test audio lifecycle with race detector and isolated ALSA null sink
        run: |
          printf 'pcm.!default { type null }\n' > "$RUNNER_TEMP/histui-null-alsa.conf"
          CGO_ENABLED=1 HISTUI_AUDIO_TEST=1 \
            PULSE_SERVER="unix:$RUNNER_TEMP/nonexistent-histui-pulse" \
            ALSA_CONFIG_PATH="$RUNNER_TEMP/histui-null-alsa.conf" \
            go test -race -count=3 -v -timeout 60s ./internal/audio

      - name: Compile audio tests for ARM64 without CGO
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go test -c -o "$RUNNER_TEMP/histui-audio-arm64.test" ./internal/audio

      - name: Cross-build CGO-free daemon for ARM64
        run: GOOS=linux GOARCH=arm64 sh scripts/puregotk/go.sh build -o /tmp/histuid-arm64 ./cmd/histuid

      - name: Build
        run: CGO_ENABLED=0 sh scripts/puregotk/go.sh build ./...

      - name: Install popup screenshot runtime
        run: dnf install -y sway swaybg grim dbus-daemon python3-dbus python3-pillow python3-gobject wayland-devel dejavu-sans-fonts shadow-utils util-linux

      - name: Verify native popup and callback lifetimes
        run: |
          dnf install -y xorg-x11-server-Xvfb
          HISTUI_TEST_GTK=1 GDK_BACKEND=x11 G_DEBUG=fatal-criticals CGO_ENABLED=1 \
            xvfb-run -a sh scripts/puregotk/go.sh test -race -count=1 ./internal/display ./internal/theme

      - name: Capture actual GTK popups in a private Wayland session
        run: |
          CGO_ENABLED=0 sh scripts/puregotk/go.sh build -o /tmp/histuid-visual ./cmd/histuid
          # Fedora grants Sway CAP_SYS_NICE, unavailable in this container.
          setcap -r /usr/bin/sway
          useradd --create-home gtkvisual
          mkdir -p /tmp/histui-gtk-visual
          chown gtkvisual:gtkvisual /tmp/histui-gtk-visual
          runuser -u gtkvisual -- sh scripts/gtk-popup/run.sh --daemon /tmp/histuid-visual --themes "$GITHUB_WORKSPACE/embed/themes" --out /tmp/histui-gtk-visual --churn 25

      - name: Retain GTK popup screenshots and animation sequences
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gtk-popup-visual-evidence
          path: /tmp/histui-gtk-visual
          retention-days: 14
          if-no-files-found: warn

  visual:
    name: TUI visual fixtures
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: fedora:rawhide
    steps:
      - name: Install visual test dependencies
        run: dnf install -y git golang python3 kitty ImageMagick xorg-x11-server-Xvfb xorg-x11-xauth dejavu-sans-mono-fonts mesa-dri-drivers
      - uses: actions/checkout@v7
      - name: Configure Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Check ANSI baselines and save actual frames
        env:
          CGO_ENABLED: "0"
          HISTUI_VISUAL_ARTIFACTS: /tmp/histui-visual
        run: go test ./internal/tui -run '^TestVisualFrames$' -count=1
      - name: Exercise the live TUI in an isolated PTY
        env:
          CGO_ENABLED: "0"
        run: |
          go build -o /tmp/histui-pty-bin ./cmd/histui
          python3 scripts/test-tui-pty.py /tmp/histui-pty-bin /tmp/histui-visual/pty
      - name: Capture synthetic frames in an isolated terminal
        if: always()
        run: xvfb-run -a -s '-screen 0 1280x800x24' python3 scripts/capture-tui.py /tmp/histui-visual
      - name: Retain screenshots and actual ANSI output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tui-visual-evidence
          path: /tmp/histui-visual
          retention-days: 14
          if-no-files-found: error
