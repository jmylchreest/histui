name: Test

on:
  push:
    tags:
      - "v*"
      - "!*SNAPSHOT*"
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    container:
      image: fedora:rawhide
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y git git-lfs golang gtk4-devel libadwaita-devel alsa-lib-devel gobject-introspection-devel gcc

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests
        run: go test -race ./...

      - name: Build
        run: go build ./...
