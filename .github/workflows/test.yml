name: Test

on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "!*SNAPSHOT*"
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      use_cache:
        description: "Use Go build cache (disable if you suspect cache issues)"
        required: false
        default: true
        type: boolean

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    container:
      image: fedora:rawhide
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y git git-lfs golang gtk4-devel gtk4-layer-shell-devel libadwaita-devel alsa-lib-devel gobject-introspection-devel gcc

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Configure Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache Go build
        if: inputs.use_cache != false
        uses: actions/cache@v6
        with:
          path: |
            /root/.cache/go-build
            /root/go/pkg/mod
          key: ${{ runner.os }}-${{ runner.arch }}-go-${{ hashFiles('go.sum') }}-${{ github.run_number }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-go-${{ hashFiles('go.sum') }}-
            ${{ runner.os }}-${{ runner.arch }}-go-

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests (pure Go packages with race detector)
        run: |
          go test -race -v -timeout 60s \
            ./internal/model/... \
            ./internal/core/... \
            ./internal/config/... \
            ./internal/dbus/... \
            ./internal/icon/... \
            ./internal/tui/... \
            ./internal/db/... \
            ./internal/adapter/...

      - name: Run tests (CGO packages with race detector)
        run: |
          go test -race -v -timeout 60s \
            ./internal/theme/... \
            ./internal/layout/...

      - name: Build
        run: CGO_ENABLED=1 go build ./...

      - name: Install popup screenshot runtime
        run: dnf install -y sway swaybg grim dbus-daemon python3-dbus python3-pillow python3-gobject wayland-devel dejavu-sans-fonts shadow-utils util-linux

      - name: Capture actual GTK popups in a private Wayland session
        run: |
          CGO_ENABLED=1 go build -o /tmp/histuid-visual ./cmd/histuid
          # Fedora grants Sway CAP_SYS_NICE, unavailable in this container.
          setcap -r /usr/bin/sway
          useradd --create-home gtkvisual
          mkdir -p /tmp/histui-gtk-visual
          chown gtkvisual:gtkvisual /tmp/histui-gtk-visual
          runuser -u gtkvisual -- sh scripts/gtk-popup/run.sh --daemon /tmp/histuid-visual --themes "$GITHUB_WORKSPACE/embed/themes" --out /tmp/histui-gtk-visual

      - name: Retain GTK popup screenshots and animation sequences
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gtk-popup-visual-evidence
          path: /tmp/histui-gtk-visual
          retention-days: 14
          if-no-files-found: warn
