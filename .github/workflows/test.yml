name: Test

on:
  push:
    tags:
      - "v*"
      - "!*SNAPSHOT*"
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    container:
      image: fedora:rawhide
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y git git-lfs golang gtk4-devel gtk4-layer-shell-devel libadwaita-devel alsa-lib-devel gobject-introspection-devel gcc

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests (pure Go packages with race detector)
        run: |
          go test -race -v -timeout 60s \
            ./internal/model/... \
            ./internal/core/... \
            ./internal/config/... \
            ./internal/dbus/... \
            ./internal/icon/... \
            ./internal/tui/... \
            ./internal/db/... \
            ./internal/adapter/...

      - name: Run tests (CGO packages without race detector)
        run: |
          go test -v -timeout 60s \
            ./internal/theme/... \
            ./internal/layout/...

      - name: Build
        run: CGO_ENABLED=1 go build ./...
