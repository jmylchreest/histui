name: Test

on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "!*SNAPSHOT*"
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      use_cache:
        description: "Use Go build cache (disable if you suspect cache issues)"
        required: false
        default: true
        type: boolean

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    container:
      image: fedora:rawhide
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y git git-lfs golang gtk4-devel gtk4-layer-shell-devel libadwaita-devel alsa-lib-devel gobject-introspection-devel gcc

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Configure Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache Go build
        if: inputs.use_cache != false
        uses: actions/cache@v6
        with:
          path: |
            /root/.cache/go-build
            /root/go/pkg/mod
          key: ${{ runner.os }}-${{ runner.arch }}-go-${{ hashFiles('go.sum') }}-${{ github.run_number }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-go-${{ hashFiles('go.sum') }}-
            ${{ runner.os }}-${{ runner.arch }}-go-

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests (pure Go packages with race detector)
        run: |
          go test -tags headless -race -v -timeout 60s \
            ./internal/model/... \
            ./internal/core/... \
            ./internal/config/... \
            ./internal/dbus/... \
            ./internal/icon/... \
            ./internal/tui/... \
            ./internal/db/... \
            ./internal/imagecapture/... \
            ./internal/adapter/...

      - name: Run tests (CGO packages with race detector)
        run: |
          go test -race -v -timeout 60s \
            ./internal/theme/... \
            ./internal/layout/...

      - name: Build
        run: CGO_ENABLED=1 go build ./...

  visual:
    name: TUI visual fixtures
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: fedora:rawhide
    steps:
      - name: Install visual test dependencies
        run: dnf install -y git golang python3 kitty ImageMagick xorg-x11-server-Xvfb xorg-x11-xauth dejavu-sans-mono-fonts mesa-dri-drivers
      - uses: actions/checkout@v7
      - name: Configure Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Check ANSI baselines and save actual frames
        env:
          CGO_ENABLED: "0"
          HISTUI_VISUAL_ARTIFACTS: /tmp/histui-visual
        run: go test ./internal/tui -run '^TestVisualFrames$' -count=1
      - name: Exercise the live TUI in an isolated PTY
        env:
          CGO_ENABLED: "0"
        run: |
          go build -o /tmp/histui-pty-bin ./cmd/histui
          python3 scripts/test-tui-pty.py /tmp/histui-pty-bin /tmp/histui-visual/pty
      - name: Capture synthetic frames in an isolated terminal
        if: always()
        run: xvfb-run -a -s '-screen 0 1280x800x24' python3 scripts/capture-tui.py /tmp/histui-visual
      - name: Retain screenshots and actual ANSI output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tui-visual-evidence
          path: /tmp/histui-visual
          retention-days: 14
          if-no-files-found: error
