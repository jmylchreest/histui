name: Test

on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "!*SNAPSHOT*"
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      use_cache:
        description: "Use Go build cache (disable if you suspect cache issues)"
        required: false
        default: true
        type: boolean

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    container:
      image: fedora:rawhide
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y git git-lfs golang gtk4-devel gtk4-layer-shell-devel libadwaita-devel alsa-lib-devel gobject-introspection-devel gcc

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Configure Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache Go build
        if: inputs.use_cache != false
        uses: actions/cache@v4
        with:
          path: |
            /root/.cache/go-build
            /root/go/pkg/mod
          key: ${{ runner.os }}-${{ runner.arch }}-go-${{ hashFiles('go.sum') }}-${{ github.run_number }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-go-${{ hashFiles('go.sum') }}-
            ${{ runner.os }}-${{ runner.arch }}-go-

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests (pure Go packages with race detector)
        run: |
          go test -race -v -timeout 60s \
            ./internal/model/... \
            ./internal/core/... \
            ./internal/config/... \
            ./internal/dbus/... \
            ./internal/icon/... \
            ./internal/tui/... \
            ./internal/db/... \
            ./internal/adapter/...

      - name: Run tests (CGO packages with race detector)
        run: |
          go test -race -v -timeout 60s \
            ./internal/theme/... \
            ./internal/layout/...

      - name: Build
        run: CGO_ENABLED=1 go build ./...
