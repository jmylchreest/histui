# histuid Configuration
# ======================
# Location: ~/.config/histui/histuid.toml
#
# All options are shown with their default values, commented out.
# Uncomment and modify only the settings you want to change.

# Logging level: debug, info, warn, error
# log_level = "info"


[display]
# Position: top-left, top-right, top-center, bottom-left, bottom-right, bottom-center
# position = "top-right"

# Offset from screen edges in pixels
# offset_x = 10
# offset_y = 10

# Maximum popups visible at once
# max_visible = 5

# Monitor: which output to show notifications on.
#   0        = compositor default (usually the focused output)
#   1, 2, .. = monitor by 1-based index
#   "DP-1"   = monitor by connector name (more stable than index)
# Connector names are logged at debug on startup ("detected output ... connector=...").
# monitor = 0

# New notifications appear at top of stack
# new_on_top = false

# Image-data display threshold: "never", "always", or size like "100 KiB"
# Filters small profile pics, shows larger album art
# image_data_preview_size = "100 KiB"


[timeouts]
# Duration strings: "5s", "30s", "1m", etc.
# Special: "0" = honor client, "never" = never expire
# low = "0"
# normal = "0"
# critical = "never"

# Fallback when client says "server decides" and config says "honor client"
# fallback = "10s"


[behavior]
# Combine identical notifications and show count
# stack_duplicates = true

# Show "(2)" badge for stacked notifications
# show_count = true

# Pause timeout on mouse hover
# pause_on_hover = true

# Max notifications in session memory
# history_length = 100


[history]
# Max notifications to store (0 = unlimited)
# max_notifications = 500

# Store notification images in history
# store_images = true


[audio]
# enabled = true
# volume = 80

[audio.sounds]
# Sound files per urgency (supports OGG, WAV, MP3, FLAC)
# low = ""
# normal = ""
# critical = ""


[theme]
# Built-in: default, minimal, compact, detailed, catppuccin
# Custom: ~/.config/histui/themes/{name}/
# name = "default"

# Color scheme: system, light, dark
# color_scheme = "system"

# Font overrides (empty = use theme/system default)
# font_family = ""
# font_size = 0


[dnd]
# Enable DnD on startup
# enabled = false

# Also suppress critical notifications in DnD mode
# suppress_critical = false


[mouse]
# Actions: dismiss, do-action, close-all, context-menu, none
# left = "dismiss"
# middle = "do-action"
# right = "close-all"
