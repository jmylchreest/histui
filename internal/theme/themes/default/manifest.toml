# Default Theme Manifest
name = "default"
description = "Default notification theme using libadwaita styling"
author = "histui"
version = "1.0.0"

[icon]
size = 48

[audio.low]
path = ""
volume = 0.8
repeat_count = -1

[audio.normal]
path = ""
volume = 1.0
repeat_count = -1

[audio.critical]
path = ""
volume = 1.0
repeat_count = 0
repeat_delay = "10s"
