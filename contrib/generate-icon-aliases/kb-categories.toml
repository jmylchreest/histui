# App Categories for histui
# =========================
#
# When an app doesn't have a brand-specific icon in Nerd Fonts,
# the AI should assign it to one of these categories instead.
#
# Run `task generate:icons:suggest` to get AI icon suggestions,
# then `task generate:icons:apply-suggestions` to populate glyph fields.

[meta]
description = "Fallback categories for apps without brand icons"
version = 2

[categories]

# Communication
[categories.messaging]
description = "Instant messaging and chat applications"
examples = ["signal", "telegram", "whatsapp", "slack", "discord"]
symbol = ""  # nf-fa-comment_dots
gtk_icon = "chat-message-new-symbolic"

[categories.email]
description = "Email clients"
examples = ["thunderbird", "evolution", "geary", "mailspring"]
symbol = ""  # nf-fa-envelope
gtk_icon = "mail-send-symbolic"

[categories.social]
description = "Social media clients"
