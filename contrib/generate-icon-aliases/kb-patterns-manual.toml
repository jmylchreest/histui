# Manual Icon Pattern Overrides
# =============================
#
# This file contains manual overrides that are merged ON TOP of the
# auto-generated kb-patterns.toml. Entries here take priority.
#
# Use this file to:
#   1. Add icons missing from upstream (e.g., Signal has no Nerd Font glyph)
#   2. Fix misclassifications (e.g., force "tor" to use linux-tor, not tortoise)
#   3. Force specific apps to use specific icons (skip AI generation)
#
# For adding extra apps to research (without pattern overrides), use extra-apps.toml instead.
#
# This file is version-controlled and manually maintained.
# kb-patterns.toml is auto-generated and should not be edited.
#
# =============================================================================
# SCHEMA
# =============================================================================
#
# [icons.<canonical-name>]
# patterns = ["pattern1", "pattern2"]   # Glyph name patterns to match
# search_terms = ["term1", "term2"]     # Additional search terms (optional)
# type = "app" | "category"             # app = brand logo, category = generic
# description = "Human description"     # What this icon represents
# upstream = "manual"                   # Always "manual" for this file
#
# # Optional: Force specific apps (REPLACES AI-generated list entirely)
# # Takes effect immediately on normal regeneration - no --ai-apps needed.
# # Use for icons without dedicated Nerd Font glyphs or when you want full control.
# force_apps = ["app1", "app2", "org.example.App"]
#
# =============================================================================
# PATTERN SYNTAX
# =============================================================================
#
# Patterns match against Nerd Font glyph names (case-insensitive):
#   "discord"       - Substring match (matches md-discord, fa-discord, etc.)
#   "md-discord"    - Exact prefix match (only Material Design)
#   "md-message*"   - Wildcard (matches md-message, md-message_lock, etc.)
#
# First matching pattern wins, so order matters for ambiguous cases.
#
# =============================================================================
# EXAMPLES
# =============================================================================

# -----------------------------------------------------------------------------
# Icons missing from upstream
# -----------------------------------------------------------------------------
# Signal doesn't have a dedicated Nerd Font glyph, so we map it to a
# privacy-themed icon and force the app list (no AI needed).

[icons.signal]
patterns = ["md-message_lock", "md-message-lock"]
type = "app"
description = "Signal private messenger"
upstream = "manual"
# Signal uses a manual icon (no dedicated Nerd Font glyph), so we control the full app list.
force_apps = [
    "signal",
    "signal-desktop",
    "signal-desktop-beta",
    "org.signal.Signal",
]

# -----------------------------------------------------------------------------
# Fixing misclassifications
# -----------------------------------------------------------------------------
# If upstream classifies something incorrectly, override it here.
# Example: "element" might be classified as generic, but it's the Matrix client.

# [icons.element]
# patterns = ["element", "matrix"]
# type = "app"
# description = "Element Matrix client"
# upstream = "manual"
# force_apps = [
#     "element",
#     "element-desktop",
#     "io.element.Element",
# ]

# =============================================================================
# YOUR OVERRIDES BELOW
# =============================================================================

# -----------------------------------------------------------------------------
# Tor - The Onion Router (NOT tortoise!)
# -----------------------------------------------------------------------------
# Tor has a dedicated icon in Nerd Fonts (linux-tor with onion symbol).
# Without this override, "tor" gets matched to "tortoise" by string similarity.

[icons.tor]
patterns = ["linux-tor"]
type = "app"
description = "Tor anonymity network and browser"
upstream = "manual"
# AI already has all tor apps - no manual overrides needed
# Keeping this entry to ensure "tor" matches linux-tor icon, not tortoise
